[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-from-ecg"
version = "2.0.0.dev0"
description = "Quality-aware, uncertainty-calibrated heart-rate and HRV estimation from noisy single-lead ECG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data  = ["wfdb>=4.1", "pandas>=2.0"]
model = ["torch>=2.2", "einops>=0.7", "mamba-ssm>=2.0"]
dev   = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["hrecg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
